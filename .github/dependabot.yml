# Propositions de mise à jour des actions GitHub des workflows.
#
# Les actions restent figées par empreinte de commit (`@<sha> # vX`,
# vérifié par scripts/check-actions.mjs) : Dependabot propose une PR qui
# remplace l'empreinte et le commentaire de version, à relire et à faire
# passer par la CI comme toute autre modification. Seul l'écosystème
# github-actions est surveillé ici.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    # Une version publiée depuis moins d'une semaine n'est pas proposée :
    # le temps qu'une publication malveillante soit repérée et retirée.
    # Les mises à jour de sécurité de Dependabot n'attendent pas.
    cooldown:
      default-days: 7
    # Peu de PR ouvertes à la fois (chacune se relit), assez pour que des
    # versions majeures en attente ne bloquent pas la PR des correctifs.
    open-pull-requests-limit: 5
    # Correctifs et versions mineures regroupés en une PR par semaine ; une
    # version majeure, qui peut changer le comportement, arrive seule.
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # dtolnay/rust-toolchain est figée sur la branche d'un canal (`# stable`,
    # `# nightly`), sans étiquette de version : Dependabot la déplacerait
    # vers une autre référence dont les entrées diffèrent. Mise à jour à la
    # main, avec la version de Rust de la CI.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    # Zone des commits du dépôt : `deps: …` (Dependabot ajoute les
    # deux-points) ; le reste du message, écrit par Dependabot, est en
    # anglais.
    commit-message:
      prefix: "deps"
