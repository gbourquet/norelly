# Job nocturne (ADR-007) : fuzzing court, bancs de performance (liste 50k,
# démarrage de bout en bout) et Stalwart en second serveur IMAP.
name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzzing (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [mime_message, sanitize_html, sanitize_css, autoconfig_xml, search_query, contact_import, contact_export]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          toolchain: nightly-2026-11-20
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-fuzz@0.13.2
          # Absent des manifestes de l'action : compilé depuis crates.io (sommes
          # du registre), jamais un binaire non vérifié de cargo-binstall.
          fallback: cargo-install
        # Compilé avec le nightly du job, sans installer aussi la chaîne de
        # rust-toolchain.toml.
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-11-20
      # cargo-fuzz résoudrait en silence un fuzz/Cargo.lock périmé : le code
      # fuzzé doit être celui que `cargo deny` a contrôlé.
      - name: Verrou du fuzzing à jour
        run: cargo +nightly-2026-11-20 metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > /dev/null
      - name: Cinq minutes par cible
        run: cargo +nightly-2026-11-20 fuzz run ${{ matrix.target }} -- -max_total_time=300 -max_len=65536 -timeout=10
      - if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

  bench:
    name: Bancs (liste 50k, démarrage)
    runs-on: ubuntu-24.04
    steps:
      - name: Dépendances système Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy, llvm-tools-preview
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm -C app install --frozen-lockfile
      - name: Liste de 50 000 messages (seuil 50 ms)
        run: cargo bench -p norelly-sqlite --locked
      - name: Démarrage de bout en bout (conteneur)
        run: NORELLY_E2E_PERF=1 pnpm -C app e2e

  stalwart:
    name: Stalwart (second serveur IMAP)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy, llvm-tools-preview
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-nextest@0.9.151
          fallback: none
      - run: cargo nextest run -p norelly-application --locked --profile stalwart
