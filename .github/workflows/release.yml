# Publication sur tag `v*` (ADR-006) : installateur NSIS (Windows, avec mise
# à jour signée minisign), .deb et .rpm (Linux), manifeste `latest.json` du
# module de mise à jour, sommes `SHA256SUMS` et attestation de provenance
# Sigstore de chaque fichier (sans clé ni secret), dans une version GitHub
# en brouillon que le mainteneur relit puis publie. Le Flatpak passe par Flathub
# (packaging/flatpak).
#
# Secrets de l'environnement GitHub `release` (tags `v*` seulement, relecture
# obligatoire du mainteneur) : TAURI_SIGNING_PRIVATE_KEY (clé minisign
# chiffrée ; clé publique dans app/src-tauri/tauri.updater.conf.json) et
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD. La clé n'est présente que dans
# l'étape de signature, jamais pendant la compilation (build.rs, macros,
# plugins Vite). Les identifiants du client Google (ADR-013),
# NORELLY_GOOGLE_CLIENT_ID et NORELLY_GOOGLE_CLIENT_SECRET, sont dans le
# même environnement : non confidentiels, ils sont compilés dans
# l'application (jobs Linux et Windows). Aucun cache dans les builds de publication
# (empoisonnement de cache).
#
# Quand le mainteneur publie le brouillon (événement `release` publié), le
# job `site` seul s'exécute : il signale la version au dépôt du site
# (`repository_dispatch` de type `norelly-release` vers
# gbourquet/norelly-site, ADR-017), qui se reconstruit à ce tag. Secret
# SITE_DISPATCH_TOKEN de l'environnement GitHub `site` : jeton d'accès fin
# limité au dépôt norelly-site, permission « Contents: write » (exigée par
# l'API des `dispatches`), aucune autre.
name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version du tag
    # Tous les jobs de construction en dépendent : ils ne tournent que sur
    # le tag, jamais à la publication du brouillon.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import json; print(json.load(open("app/src-tauri/tauri.conf.json"))["version"])')"
          test "v$version" = "$TAG" || { echo "tag $TAG ≠ version $version" >&2; exit 1; }
          # Semver, éventuelle préversion : la version entre dans les noms des
          # fichiers publiés et l'identité vérifiée de l'attestation.
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "version invalide : $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux (.deb, .rpm)
    needs: version
    runs-on: ubuntu-24.04
    # Identifiants du client Google (secrets de l'environnement).
    environment: release
    steps:
      - name: Dépendances système Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy, llvm-tools-preview
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: pnpm -C app install --frozen-lockfile
      - name: Build (identifiants client Google des secrets, ADR-013)
        env:
          NORELLY_GOOGLE_CLIENT_ID: ${{ secrets.NORELLY_GOOGLE_CLIENT_ID }}
          NORELLY_GOOGLE_CLIENT_SECRET: ${{ secrets.NORELLY_GOOGLE_CLIENT_SECRET }}
        run: |
          # Format vérifié sans jamais afficher les valeurs.
          [[ "$NORELLY_GOOGLE_CLIENT_ID" =~ ^[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com$ ]] \
            && [[ "$NORELLY_GOOGLE_CLIENT_SECRET" =~ ^GOCSPX-[A-Za-z0-9_-]+$ ]] \
            || { echo "secrets NORELLY_GOOGLE_CLIENT_ID/SECRET absents ou mal formés" >&2; exit 1; }
          pnpm -C app tauri build --bundles deb,rpm -- --locked
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  windows:
    name: Windows (NSIS, mise à jour signée)
    needs: version
    runs-on: windows-2025
    environment: release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy, llvm-tools-preview
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: pnpm -C app install --frozen-lockfile
      - name: Build NSIS avec le module de mise à jour (sans la clé)
        env:
          NORELLY_GOOGLE_CLIENT_ID: ${{ secrets.NORELLY_GOOGLE_CLIENT_ID }}
          NORELLY_GOOGLE_CLIENT_SECRET: ${{ secrets.NORELLY_GOOGLE_CLIENT_SECRET }}
        run: |
          # Format vérifié sans jamais afficher les valeurs.
          [[ "$NORELLY_GOOGLE_CLIENT_ID" =~ ^[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com$ ]] \
            && [[ "$NORELLY_GOOGLE_CLIENT_SECRET" =~ ^GOCSPX-[A-Za-z0-9_-]+$ ]] \
            || { echo "secrets NORELLY_GOOGLE_CLIENT_ID/SECRET absents ou mal formés" >&2; exit 1; }
          pnpm -C app tauri build --bundles nsis \
            --config src-tauri/tauri.updater.conf.json \
            --features updater -- --locked
      - name: Signature minisign de l'installateur
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ needs.version.outputs.version }}
        run: >
          app/node_modules/.bin/tauri signer sign
          "target/release/bundle/nsis/Norelly_${VERSION}_x64-setup.exe"
      - name: Manifeste latest.json
        env:
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          cd target/release/bundle/nsis
          installer="Norelly_${VERSION}_x64-setup.exe"
          test -f "$installer" && test -f "$installer.sig"
          python - "$installer" <<'PY'
          import datetime, json, os, sys
          installer = sys.argv[1]
          version, repo = os.environ["VERSION"], os.environ["REPO"]
          manifest = {
              "version": version,
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "windows-x86_64": {
                      "signature": open(installer + ".sig", encoding="utf-8").read().strip(),
                      "url": f"https://github.com/{repo}/releases/download/v{version}/{installer}",
                  }
              },
          }
          json.dump(manifest, open("latest.json", "w", encoding="utf-8"), indent=2)
          PY
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: windows
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
            target/release/bundle/nsis/latest.json
          if-no-files-found: error

  assets:
    name: Fichiers, sommes et provenance
    needs: [version, linux, windows]
    runs-on: ubuntu-24.04
    # Jeton OIDC (certificat Sigstore éphémère, sans clé à garder) et
    # écriture des attestations : ce job seul, sans droit d'écriture sur le
    # dépôt ni secret.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Les seuls artefacts des builds, nommés (jamais `release`, laissé par
      # une tentative précédente de ce job), un dossier chacun (pas de
      # fusion, qui écraserait sans bruit deux fichiers du même nom) ;
      # release-assets.sh les met à plat.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux
          path: artifacts/linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows
          path: artifacts/windows
      - name: Manifestes winget (à proposer à microsoft/winget-pkgs)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ./scripts/winget-manifests.sh "$VERSION" "artifacts/windows/Norelly_${VERSION}_x64-setup.exe" winget
          mkdir -p artifacts/winget
          (cd winget && zip -q "../artifacts/winget/winget-manifests-${VERSION}.zip" ./*.yaml)
      - name: Fichiers publiés et sommes SHA-256
        run: ./scripts/release-assets.sh artifacts dist
      # Une attestation de provenance SLSA, signée par Sigstore avec
      # l'identité de ce workflow, couvre chaque fichier publié, SHA256SUMS
      # compris ; enregistrée sur GitHub et jointe à la version.
      - name: Attestation de provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Attestation jointe à la version
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          VERSION: ${{ needs.version.outputs.version }}
        run: cp -- "$BUNDLE" "dist/Norelly_${VERSION}_provenance.sigstore.json"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release
          path: dist/
          if-no-files-found: error
          # Relance du job : remplace l'artefact de la tentative précédente.
          overwrite: true

  publish:
    name: Version GitHub (brouillon)
    needs: [version, assets]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      # Ce qui part est exactement ce qui a été sommé et attesté par ce
      # workflow, pour ce tag et ce commit (même vérification que celle
      # proposée aux utilisateurs).
      - name: Vérification des sommes et de la provenance
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd dist
          bundle="Norelly_${VERSION}_provenance.sigstore.json"
          sha256sum --check --strict SHA256SUMS
          mapfile -t listed < <(cut -d' ' -f3- SHA256SUMS)
          expected="$(printf '%s\n' "${listed[@]}" SHA256SUMS "$bundle" | LC_ALL=C sort)"
          if [ "$(LC_ALL=C ls -A)" != "$expected" ]; then
            echo "fichiers non sommés dans la version" >&2
            exit 1
          fi
          gh --version
          # Identité exacte du certificat (égalité, pas un préfixe) : ce
          # workflow, à ce tag.
          for file in "${listed[@]}" SHA256SUMS; do
            gh attestation verify "$file" --bundle "$bundle" \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
      - name: Brouillon de version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release create "$TAG" dist/*
          --repo "$GITHUB_REPOSITORY" --draft --verify-tag
          --title "Norelly $TAG" --generate-notes

  site:
    name: Signal de publication au site
    # Version publiée par le mainteneur (brouillon relu), jamais un
    # brouillon : le site ne propose que ce qui se télécharge. Une
    # préversion ne change pas le site, qui suit la dernière version stable.
    if: >-
      github.event_name == 'release'
      && !github.event.release.draft
      && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    environment: site
    permissions: {}
    steps:
      - name: repository_dispatch vers gbourquet/norelly-site
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$SITE_DISPATCH_TOKEN" ]; then
            echo "::error::secret SITE_DISPATCH_TOKEN absent de l'environnement « site » : norelly.fr ne sera pas mis à jour (docs/technique/methode.md)" >&2
            exit 1
          fi
          # Tag d'une version (même forme que celle contrôlée à la
          # construction) : seule valeur transmise au dépôt du site.
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::tag de version invalide : $TAG" >&2; exit 1; }
          payload="$(jq -cn --arg tag "$TAG" '{event_type: "norelly-release", client_payload: {tag: $tag}}')"
          # Réponse attendue : 204. Toute autre (jeton refusé, expiré, sans
          # la permission, dépôt introuvable) fait échouer le job.
          GH_TOKEN="$SITE_DISPATCH_TOKEN" gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            repos/gbourquet/norelly-site/dispatches --input - <<<"$payload"
