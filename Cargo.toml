[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/application",
    "crates/adapters/*",
    "crates/test-support",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gbourquet/norelly"
publish = false

[workspace.dependencies]
# Internes
norelly-domain = { path = "crates/domain" }
norelly-application = { path = "crates/application" }
norelly-test-support = { path = "crates/test-support" }
# Domaine : seules dépendances autorisées (voir scripts/check-domain-deps.sh)
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
# Adaptateurs internes
norelly-tls = { path = "crates/adapters/tls" }
norelly-imap = { path = "crates/adapters/imap" }
norelly-smtp = { path = "crates/adapters/smtp" }
norelly-keyring = { path = "crates/adapters/keyring" }
norelly-discovery = { path = "crates/adapters/discovery" }
norelly-sqlite = { path = "crates/adapters/sqlite" }
norelly-blobs = { path = "crates/adapters/blobs" }
# Infra
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
testcontainers = "0.28"
# Niveau TRACE supprimé à la compilation pour tout le binaire : imap-next
# journalise en TRACE chaque octet envoyé, mot de passe compris
# (imap-next 0.3.4, src/fragment.rs). Voir ADR-002.
tracing = { version = "0.1", features = ["max_level_debug", "release_max_level_debug"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
zeroize = "1.8"
# TLS : rustls avec le fournisseur ring (aws-lc-rs écarté : licence OpenSSL
# hors ADR-009 et chaîne de compilation C plus lourde).
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-platform-verifier = "0.7"
ring = "0.17"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
# Protocoles
imap-next = { version = "0.3.4", default-features = false, features = ["starttls", "ext_condstore_qresync"] }
# Sans backend TLS : la négociation TLS est faite par norelly-tls, le flux
# chiffré est confié à lettre (voir ADR-002 et crates/adapters/smtp).
mail-parser = "0.11"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "tokio1"] }
# Trousseau : keyring-core et magasins natifs choisis explicitement (le
# crate `keyring` 4 impose zbus 5, dont des dépendances sont signalées non
# maintenues : RUSTSEC-2026-0370 à 0372). Sous Linux, libdbus du système.
# Autodécouverte : HTTPS seulement, TLS par norelly-tls (fournisseur ring,
# vérificateur de la plateforme) ; pas de cookies, pas de HTTP/2.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
quick-xml = "0.42"
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "system-config"] }
wiremock = "0.6.5"
proptest = { version = "1.7", default-features = false, features = ["std"] }
# Stockage (ADR-003) : SQLite embarqué ; rusqlite aligné sur rusqlite_migration.
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
# Messages bruts compressés (.eml.zst, ADR-003).
zstd = "0.13"
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
keyring-core = "1"
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
windows-native-keyring-store = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 1
