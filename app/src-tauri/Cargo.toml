[package]
name = "norelly-app"
description = "Shell Tauri de Norelly : adaptateur entrant (IPC, protocoles) et point d'assemblage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "norelly_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
# Contrat IPC typé (ADR-005) ; versions figées : tauri-specta est en RC.
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.26" }
specta-typescript = "=0.0.13"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
reqwest.workspace = true
url = "2.5"
# Ouverture dans le navigateur ou l'application du système (xdg-open,
# ShellExecute), appelée depuis Rust seulement. tauri-plugin-opener est
# écarté : il tire zbus 5, dont des dépendances sont signalées non
# maintenues (voir deny.toml).
open = "5.3"
# Sélecteur de dossier, appelé depuis Rust seulement (aucune permission
# accordée à l'interface).
tauri-plugin-dialog = "2.6"
# Notifications natives, appelées depuis Rust seulement : le
# texte composé par l'interface passe par une commande IPC qui le
# revalide ; aucune permission accordée à l'interface. notify-rust sans
# zbus (fonctionnalité `d` : libdbus du système sous Linux) :
# tauri-plugin-notification tire zbus 5, dont des dépendances sont
# signalées non maintenues (voir deny.toml).
# Mises à jour (ADR-006) : installateur NSIS seulement, fonctionnalité
# `updater` activée par release.yml pour Windows ; absent des autres canaux.
tauri-plugin-updater = { version = "2", optional = true }
notify-rust = { version = "4", default-features = false, features = ["d"] }
norelly-domain.workspace = true
norelly-application.workspace = true
norelly-tls.workspace = true
norelly-imap.workspace = true
norelly-smtp.workspace = true
norelly-keyring.workspace = true
norelly-discovery.workspace = true
norelly-sqlite.workspace = true
norelly-blobs.workspace = true
norelly-render.workspace = true
norelly-contacts-io.workspace = true
norelly-oauth.workspace = true

[features]
updater = ["dep:tauri-plugin-updater"]

[dev-dependencies]
norelly-test-support.workspace = true
# Application factice (MockRuntime) : commandes IPC testées sans webview.
tauri = { version = "2.12", features = ["test"] }

[lints]
workspace = true
