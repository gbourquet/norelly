[package]
name = "norelly-render"
description = "Adaptateur de rendu : MIME vers vue, assainissement HTML, CSP et agent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
norelly-domain.workspace = true
# Charsets hérités (ISO-2022-JP, windows-125x…) : full_encoding.
mail-parser = { workspace = true, features = ["full_encoding"] }
ammonia.workspace = true
# Construction MIME des messages rédigés (ADR-002).
lettre = { workspace = true, features = ["builder"] }
getrandom.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
sha2.workspace = true

[build-dependencies]
# Empreinte SHA-256 de l'agent, calculée à la compilation (CSP).
sha2.workspace = true

[lints]
workspace = true
