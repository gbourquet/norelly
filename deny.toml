# Politique de dépendances (ADR-009).

[graph]
all-features = true

[advisories]
# Toute vulnérabilité connue fait échouer la vérification.
yanked = "deny"
ignore = [
    # Non maintenu (pas une vulnérabilité). Tiré par gtk3-macros, via les
    # bindings GTK3 de Tauri 2 sous Linux. Aucune alternative tant que Tauri
    # n'a pas migré vers GTK4. À réévaluer à chaque montée de Tauri.
    { id = "RUSTSEC-2024-0370", reason = "transitif via Tauri/GTK3, non maintenu, pas de vulnérabilité" },
]

[licenses]
# Licences permissives acceptées. GPL/AGPL refusées (absentes de la liste).
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
